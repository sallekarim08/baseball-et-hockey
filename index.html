<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse Baseball & Hockey</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9096a3;
    --accent-baseball: #e63946;
    --accent-hockey: #4d9de0;
    --accent: var(--accent-baseball);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .sport-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .sport-toggle button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .sport-toggle button.active[data-sport="baseball"] {
    background: var(--accent-baseball);
    border-color: var(--accent-baseball);
  }
  .sport-toggle button.active[data-sport="hockey"] {
    background: var(--accent-hockey);
    border-color: var(--accent-hockey);
  }
  .status-bar {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .day-group {
    margin-bottom: 20px;
  }
  .day-label {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px 2px;
  }
  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .match-teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
  }
  .team-name { font-weight: 600; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .match-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .badge.final { background: #2a2e38; color: var(--muted); }
  .badge.live { background: #3a1a1a; color: #ff6b6b; }
  .badge.scheduled { background: #1a2a3a; color: #6ba8ff; }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<h1>Analyse Baseball & Hockey</h1>
<p class="subtitle">Données officielles MLB & NHL — mise à jour automatique</p>

<div class="sport-toggle">
  <button data-sport="baseball" class="active">⚾ Baseball</button>
  <button data-sport="hockey">🏒 Hockey sur glace</button>
</div>

<div class="status-bar" id="statusBar">Chargement…</div>
<div id="content"></div>

<script>
  let currentSport = 'baseball';

  const buttons = document.querySelectorAll('.sport-toggle button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSport = btn.dataset.sport;
      loadData();
    });
  });

  function statusBadge(status) {
    const s = (status || '').toLowerCase();
    if (s.includes('final') || s === 'off') return { cls: 'final', label: 'Terminé' };
    if (s.includes('live') || s.includes('crit')) return { cls: 'live', label: 'En direct' };
    return { cls: 'scheduled', label: 'À venir' };
  }

  function formatDateLabel(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadData() {
    const content = document.getElementById('content');
    const statusBar = document.getElementById('statusBar');
    content.innerHTML = '<div class="empty">Chargement…</div>';

    try {
      const res = await fetch(`data/${currentSport}.json?t=` + Date.now());
      if (!res.ok) throw new Error('Fichier de données introuvable');
      const data = await res.json();
      const games = data.games || [];

      statusBar.textContent = games.length
        ? `${games.length} match(s) — dernière mise à jour : ${new Date(data.updatedAt).toLocaleString('fr-FR')}`
        : 'Aucune donnée disponible pour le moment';

      if (!games.length) {
        content.innerHTML = '<div class="empty">Aucun match disponible pour cette sélection.</div>';
        return;
      }

      const groups = {};
      games.sort((a, b) => new Date(a.date) - new Date(b.date));
      for (const g of games) {
        const dayKey = new Date(g.date).toDateString();
        (groups[dayKey] = groups[dayKey] || []).push(g);
      }

      content.innerHTML = Object.entries(groups).map(([day, dayGames]) => `
        <div class="day-group">
          <div class="day-label">${formatDateLabel(dayGames[0].date)}</div>
          ${dayGames.map(renderMatchCard).join('')}
        </div>
      `).join('');
    } catch (err) {
      statusBar.textContent = '';
      content.innerHTML = `<div class="empty">Données pas encore générées — le robot passera dans les prochaines heures.</div>`;
      console.error(err);
    }
  }

  function renderMatchCard(g) {
    const badge = statusBadge(g.status);
    const hasScore = g.awayScore !== null && g.homeScore !== null;
    return `
      <div class="match-card">
        <div class="match-teams">
          <span class="team-name">${g.away}</span>
          <span class="score">${hasScore ? `${g.awayScore} – ${g.homeScore}` : formatTime(g.date)}</span>
          <span class="team-name">${g.home}</span>
        </div>
        <div class="match-meta">
          <span>${g.venue || ''}</span>
          <span class="badge ${badge.cls}">${badge.label}</span>
        </div>
      </div>
    `;
  }

  loadData();
</script>

</body>
</html>
